<div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 md:p-6 animate-in fade-in duration-300">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-lg font-bold text-slate-800">Checking Accounts</h2>
    <button (click)="parent().openAccountForm(false)" class="text-sm bg-indigo-50 text-indigo-600 px-4 py-2 rounded-lg font-semibold hover:bg-indigo-100 transition">+ New Account</button>
  </div>

  <!-- New/Edit Account Form -->
  @if (parent().accountFormOpen() && (parent().accountForm()?.type === 'checking' || parent().accountForm()?.type === 'investment')) {
    <form (submit)="$event.preventDefault(); parent().saveAccount()" class="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6 space-y-4 animate-in slide-in-from-top-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div><label class="block text-xs font-semibold text-slate-500 mb-1">Account Name</label><input type="text" required [value]="parent().accountForm()?.name" (input)="parent().updateAccountForm('name', $any($event.target).value)" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-100 focus:outline-none" /></div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">Initial Balance</label>
          <div class="relative"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">R$</span><input type="number" step="0.01" [value]="parent().accountForm()?.initialBalance || 0" (input)="parent().updateAccountForm('initialBalance', $any($event.target).value)" class="w-full bg-white border border-slate-200 rounded-lg pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-100" /></div>
        </div>
      </div>
      <div class="flex gap-3 justify-end pt-2"><button type="button" (click)="parent().closeAccountForm()" class="px-4 py-2 text-sm font-medium text-slate-500 hover:bg-slate-200 rounded-lg">Cancel</button><button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg">Save</button></div>
    </form>
  }

  <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
    @for (acc of parent().debitAccounts(); track acc.id) {
      <div class="flex items-center justify-between p-4 border border-slate-100 rounded-xl hover:bg-slate-50 group">
        <div class="flex items-center gap-4">
          <div class="w-10 h-10 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center"><i class="ph ph-bank text-lg"></i></div>
          <p class="font-semibold text-slate-800">{{ acc.name }}</p>
        </div>
        <div class="flex gap-2 md:opacity-0 group-hover:opacity-100 transition">
          @if (acc.providerId === 'pluggy') {
            <button (click)="parent().refreshAccount(acc)" [disabled]="parent().syncingAccountId() === acc.id" class="p-2 text-slate-400 hover:text-indigo-500 rounded-lg disabled:opacity-50" title="Atualizar saldo e transações">
              <i class="ph ph-arrow-clockwise text-lg" [class.animate-spin]="parent().syncingAccountId() === acc.id"></i>
            </button>
          }
          <button (click)="parent().openAccountForm(false, acc)" class="p-2 text-slate-400 hover:text-indigo-500 rounded-lg"><i class="ph ph-pencil-simple text-lg"></i></button>
          <button (click)="parent().deleteAccount(acc.id)" class="p-2 text-slate-400 hover:text-red-500 rounded-lg"><i class="ph ph-trash text-lg"></i></button>
        </div>
      </div>
    }
  </div>
</div>
